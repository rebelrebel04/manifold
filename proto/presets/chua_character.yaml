name: chua_character
description: Chua double-scroll - two attractor wings like Lorenz but with richer harmonic content in orbital motion.
tier: per_engine

cores:
  - id: chua1
    type: chua
    speed: 1.0

chain:
  - id: fold
    type: wavefolder
    drive: 1.5
  - id: filt
    type: svf_morph
    cutoff: 180.0
    resonance: 0.45
    morph: 0.5

modulation:
  - { src: chua1.x, dst: fold.drive,    depth: 2.8, scale: linear, range: positive }
  - { src: chua1.z, dst: filt.cutoff,   depth: 4.2, scale: exp2,   range: positive }
  - { src: chua1.y, dst: filt.resonance, depth: 0.3, scale: linear, range: positive }
  - { src: chua1.x, dst: filt.morph,    depth: 0.45, scale: linear, range: bipolar }
