name: combo_triple_continuous
description: Three continuous attractors at staggered timescales - Thomas slow drift, Chua mid double-scroll, Aizawa fast petals. One engine per parameter family.
tier: combo

cores:
  - id: tho1
    type: thomas
    speed: 0.4
  - id: chua1
    type: chua
    speed: 1.0
  - id: aiz1
    type: aizawa
    speed: 2.0

chain:
  - id: fold
    type: wavefolder
    drive: 1.5
  - id: filt
    type: svf_morph
    cutoff: 240.0
    resonance: 0.45
    morph: 0.5

modulation:
  - { src: aiz1.x,  dst: fold.drive,     depth: 3.0, scale: linear, range: positive }
  - { src: chua1.z, dst: filt.cutoff,    depth: 4.5, scale: exp2,   range: positive }
  - { src: tho1.y,  dst: filt.resonance, depth: 0.28, scale: linear, range: positive }
  - { src: tho1.x,  dst: filt.morph,     depth: 0.5, scale: linear, range: bipolar }
