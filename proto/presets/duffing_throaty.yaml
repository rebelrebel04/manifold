name: duffing_throaty
description: BP-heavy filter, strong resonance, input-coupled. Vocal/throaty morph character.
tier: per_engine

cores:
  - id: duff
    type: duffing
    delta: 0.18
    gamma: 0.3
    omega: 1.2
    speed: 140.0
    input_drive: 4.0

chain:
  - id: fold
    type: wavefolder
    drive: 1.3
  - id: filt
    type: svf_morph
    cutoff: 700.0
    resonance: 0.55
    morph: 0.5   # BP center
  - id: post
    type: svf
    mode: lp
    cutoff: 5000.0
    resonance: 0.1

modulation:
  - { src: duff.x, dst: fold.drive,    depth: 1.2, scale: linear, range: positive }
  - { src: duff.v, dst: filt.cutoff,   depth: 2.0, scale: exp2,   range: bipolar }
  - { src: duff.x, dst: filt.morph,    depth: 0.3, scale: linear, range: bipolar }
  - { src: duff.v, dst: filt.resonance, depth: 0.15, scale: linear, range: positive }
