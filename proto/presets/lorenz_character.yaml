name: lorenz_character
description: Flagship. Lorenz drives wavefold + morphing SVF; regime switching gives rhythmic pulsing.
tier: per_engine

cores:
  - id: lor1
    type: lorenz
    speed: 1.2

chain:
  - id: fold
    type: wavefolder
    drive: 1.5
  - id: filt
    type: svf_morph
    cutoff: 150.0
    resonance: 0.4
    morph: 0.5

modulation:
  - { src: lor1.x, dst: fold.drive,    depth: 2.5, scale: linear, range: positive }
  - { src: lor1.y, dst: filt.cutoff,   depth: 4.0, scale: exp2,   range: positive }
  - { src: lor1.z, dst: filt.resonance, depth: 0.3, scale: linear, range: positive }
  - { src: lor1.z, dst: filt.morph,    depth: 0.35, scale: linear, range: bipolar }
