name: macro_chua
description: Chua driven by macros only. Sweep cores.chua1.macros.intensity/speed/warmth via --override.
tier: per_engine

cores:
  - id: chua1
    type: chua
    macros:
      intensity: 0.5
      speed: 0.4
      warmth: 0.0

chain:
  - id: fold
    type: wavefolder
    drive: 1.5
  - id: filt
    type: svf_morph
    cutoff: 200.0
    resonance: 0.5
    morph: 0.5

modulation:
  - { src: chua1.x, dst: fold.drive,     depth: 3.0, scale: linear, range: positive }
  - { src: chua1.z, dst: filt.cutoff,    depth: 4.5, scale: exp2,   range: positive }
  - { src: chua1.y, dst: filt.resonance, depth: 0.3, scale: linear, range: positive }
  - { src: chua1.x, dst: filt.morph,     depth: 0.5, scale: linear, range: bipolar }
