name: thomas_drift
description: Slow Thomas - meandering, ambient drift. Shapes the source over long timescales.
tier: per_engine

cores:
  - id: tho1
    type: thomas
    speed: 0.4
    b: 0.195

chain:
  - id: fold
    type: wavefolder
    drive: 1.1
  - id: filt
    type: svf_morph
    cutoff: 400.0
    resonance: 0.28
    morph: 0.4

modulation:
  - { src: tho1.x, dst: fold.drive,  depth: 0.8, scale: linear, range: positive }
  - { src: tho1.y, dst: filt.cutoff, depth: 2.2, scale: exp2,   range: bipolar }
  - { src: tho1.z, dst: filt.morph,  depth: 0.3, scale: linear, range: bipolar }
